{% extends "base.html" %}
{% block content %}
<div class="library-header">
    <h1>Game Library</h1>
    <p>{{ games|length }} games</p>
</div>

<div class="game-grid">
    {% for game in games %}
    <div class="game-card">
        <img src="https://cdn.akamai.steamstatic.com/steam/apps/{{ game.appid }}/header.jpg" alt="{{ game.name }}">
        <div class="game-info">
            <h3>{{ game.name }}</h3>
            <p>{{ (game.playtime_forever / 60) | round(1) }} hrs</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
