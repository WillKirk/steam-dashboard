{% extends "base.html" %}
{% block content %}
<div class="profile">
    {% if player %}
        <img src="{{ player.avatarfull }}" alt="Avatar">
        <h1>{{ player.personaname }}</h1>
        <p>Steam ID: {{ player.steamid }}</p>
    {% else %}
        <p>Could not load profile. Check your API key and Steam ID.</p>
    {% endif %}
</div>
{% endblock %}
